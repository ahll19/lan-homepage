---
# Main dashboard body. Structure is:
#
# - GroupName:
#     - Service Display Name:
#         icon: <icon>
#         href: <link the card opens when clicked>
#         description: <small grey subtext>
#         widget:            # optional — live stats pulled from the service's API
#           type: <integration type>
#           url: <internal URL/port the widget calls, can differ from href>
#           key: <api key/token, if required>
#
# Group names below MUST match the layout: keys in settings.yaml.
# Docs: https://gethomepage.dev/configs/services/
# Full widget integration list + required fields per service:
#   https://gethomepage.dev/widgets/services/

- Media:
    - Plex: # rename to "Jellyfin" and swap widget type if that's what you run
        icon: plex.png
        href: https://plex.example.dk        # your NPM hostname
        description: Movies & TV
        widget:
          type: plex
          url: http://192.168.1.X:32400      # internal IP:port, bypasses NPM
          key: "{{HOMEPAGE_VAR_PLEX_KEY}}"

- Home:
    - Home Assistant:
        icon: home-assistant.png
        href: https://ha.example.dk
        description: Smart home
        widget:
          type: homeassistant
          url: http://192.168.1.X:8123
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"

    - Mealie:
        icon: mealie.png
        href: https://mealie.example.dk
        description: Recipes & meal planning
        widget:
          type: mealie
          url: http://192.168.1.X:9000
          key: "{{HOMEPAGE_VAR_MEALIE_KEY}}"

- Infrastructure:
    - TrueNAS:
        icon: truenas-scale.png
        href: https://truenas.example.dk
        description: NAS / storage
        widget:
          type: truenas
          url: https://192.168.1.X             # TrueNAS SCALE web UI address
          key: "{{HOMEPAGE_VAR_TRUENAS_KEY}}"   # API key from TrueNAS UI > API Keys

    - Nginx Proxy Manager:
        icon: nginx-proxy-manager.png
        href: https://npm.example.dk
        description: Reverse proxy / SSL

- Apps:
    # Start everything else here as a plain link (no widget block needed),
    # then upgrade individual ones to widgets once you confirm they're supported:
    # https://gethomepage.dev/widgets/services/
    #
    # - App Name:
    #     icon: appname.png
    #     href: https://app.example.dk
    #     description: one line about what it does