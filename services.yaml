---
- Media:
    - Jellyfin:
        icon: jellyfin.png
        href: https://jellyfin.lauridsen.it
        description: Movies & TV
        widget:
          type: jellyfin
          url: https://jellyfin.lauridsen.it
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
          enableMediaControl: true

- Home:
    - Home Assistant:
        icon: home-assistant.png
        href: https://hjem.lauridsen.it
        description: Home Assistant
        widget:
          type: homeassistant
          url: https://hjem.lauridsen.it
          key: "{{HOMEPAGE_VAR_HA_TOKEN}}"
          custom:
            - template: "{{ states.person|selectattr('state','equalto','home')|list|length }}"
              label: "People Home"
            - template: |
                {% set light_ids = ['light.bornevaerelse', 'light.gang', 'light.sovevaerelse', 'light.stue'] %}
                {{ light_ids | select('is_state', 'on') | list | length }}
              label: "Rooms with lights On"
            - template: |
                {% set sensor_ids = ['binary_sensor.dorsensor_gang_fordor_contact', 'binary_sensor.dorsensor_kokken_bagdor_contact'] %}
                {% set ns = namespace(latest=none, entity=none) %}
                {% for sensor in sensor_ids %}
                {% set changed = states[sensor].last_changed %}
                {% if ns.latest is none or changed > ns.latest %}
                    {% set ns.latest = changed %}
                    {% set ns.entity = sensor %}
                {% endif %}
                {% endfor %}
                {% if ns.entity %}
                {{ 'Opened' if is_state(ns.entity, 'on') else 'Closed' }} {{ relative_time(ns.latest) }} ago
                {% else %}
                Unknown
                {% endif %}
              label: "Last Door Open"
    
    - ESPHome:
        icon: esphome.png
        href: https://esphome.lauridsen.it
        description: ESPHome
        widget:
          type: esphome
          url: https://esphome.lauridsen.it

- Infrastructure:
    - TrueNAS:
        icon: truenas-scale.png
        href: https://192.168.1.65
        description: NAS / storage
        widget:
          type: truenas
          url: https://192.168.1.65
          version: 2
          key: "{{HOMEPAGE_VAR_TRUENAS_TOKEN}}"
          enablePools: true
          nasType: scale

    - Nginx Proxy Manager - Internal:
        icon: nginx-proxy-manager.png
        href: http://192.168.1.251:81
        description: Reverse proxy / SSL
        widget:
          type: npm
          url: http://192.168.1.251:81
          username: "{{HOMEPAGE_VAR_NPM_USER}}"
          password: "{{HOMEPAGE_VAR_NPM_PASS}}"
    
    - Nginx Proxy Manager - External:
        icon: nginx-proxy-manager.png
        href: http://192.168.1.64:81
        description: Reverse proxy / SSL
        widget:
          type: npm
          url: http://192.168.1.64:81
          username: "{{HOMEPAGE_VAR_NPM_USER}}"
          password: "{{HOMEPAGE_VAR_NPM_PASS}}"
